<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市景点推荐 - Easy Travel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="page-container">
        <div class="container">
            <div class="header">
                <h1>🗺️ 城市景点推荐</h1>
                <p>输入城市名称，探索热门景点</p>
            </div>

            <div class="search-box">
                <input type="text" id="cityInput" placeholder="输入城市名称：如北京市" onkeypress="handleKeyPress(event)">
                <button onclick="searchSpots()">搜索</button>
            </div>
            <div class="site-desc">
                城市景点太多，不知道住哪？选择你想去的景点，自动计算所选全部景点的中心位置，并推荐评分比较高的酒店，然后就可以一家酒店玩一座城市，不用再换酒店啦！
            </div>
            <div id="resultContainer"></div>
        </div>
    </div>

    <div class="selection-bar" id="selectionBar">
        <span class="selection-count" id="selectionCount">已选择 0 个景点</span>
        <button onclick="searchHotels()">查询所选景点中心点附近酒店</button>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
