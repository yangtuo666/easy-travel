<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市景点推荐 - Easy Travel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ 城市景点推荐</h1>
            <p>输入城市名称，探索热门景点</p>
        </div>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="请输入城市名称，如：北京、上海、杭州" onkeypress="handleKeyPress(event)">
            <button onclick="searchSpots()">搜索</button>
        </div>

        <div id="resultContainer"></div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
