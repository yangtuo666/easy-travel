<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店推荐 - Easy Travel</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .hotel-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .hotel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .hotel-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .hotel-address {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .hotels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: #333;
            font-size: 2em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
            font-size: 1em;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #f0f0f0;
            color: #333;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="container">
            <a href="index.html" class="back-btn">← 返回景点页面</a>
            <div class="page-header">
                <h1>🏨 推荐酒店</h1>
                <p>根据您选择的景点位置，为您推荐附近优质酒店</p>
            </div>
            <div id="hotelContainer">
                <div class="loading">正在加载酒店数据...</div>
            </div>
        </div>
    </div>

    <script>
        function showHotels() {
            const container = document.getElementById('hotelContainer');
            const hotels = window.hotelData;

            if (!hotels || hotels.length === 0) {
                container.innerHTML = '<div class="empty-msg">未找到相关酒店</div>';
                return;
            }

            const gridHtml = hotels.map(hotel => `
                <div class="hotel-card">
                    <div class="hotel-name">${escapeHtml(hotel.name)}</div>
                    <div class="hotel-address">${escapeHtml(hotel.address || '地址暂无')}</div>
                    <div class="spot-rating">
                        <span class="rating-star">★</span>
                        <span class="rating-score">${escapeHtml(hotel.rating || '0.0')}</span>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="hotels-grid">${gridHtml}</div>`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        if (window.hotelData) {
            showHotels();
        }
    </script>
</body>
</html>
